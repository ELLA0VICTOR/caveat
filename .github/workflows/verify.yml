name: Verify Caveat
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup target add wasm32v1-none
      - run: bash scripts/verify-contracts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: caveat-soroban-contracts
          path: |
            contracts/target/wasm32v1-none/release/*.wasm
            contracts/target/wasm32v1-none/release/SHA256SUMS
          if-no-files-found: error
